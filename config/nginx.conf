events {
    worker_connections 1024;
}

http {
    upstream grafana {
        server grafana:3000;
    }

    upstream jupyterhub {
        server jupyterhub:8888;
    }

    upstream symmetricds {
        server symmetricds-hub:31415;
    }

    server {
        listen        80;
        listen        443 ssl;    
        server_name   localhost;
        proxy_set_header Host $host;  
        include /etc/nginx/ssl/snippets/self-signed.conf;         
        include /etc/nginx/ssl/snippets/ssl-params.conf;          
        ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;        
        ssl_ciphers         HIGH:!aNULL:!MD5;              
        server_tokens off;

	    
	server_name _;

        # Main traffic goes to Grafana
        location / {
            proxy_pass http://grafana;
	    #proxy_set_header X-Real-IP $remote_addr;
	    #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    #proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /sync/ routes to SymmetricDS hub (outdoor monitoring edge sync)
        location /sync/ {
            proxy_pass http://symmetricds;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # /hub routes to JupyterHub
        location /hub {
            proxy_pass http://jupyterhub;
	    #proxy_set_header X-Real-IP $remote_addr;
	    #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    #proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Jupyter
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}

