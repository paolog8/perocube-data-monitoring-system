services:
  # TimescaleDB (PostgreSQL) service
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    #build: ./db
    container_name: postgres
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-perocube}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - /nfs/qumulo-a/grafana01/postgres/data:/var/lib/postgresql/data
      - /nfs/qumulo-a/grafana01/postgres/scripts:/scripts
      - /nfs/qumulo-a/grafana01/postgres/sql:/sql
      # following line not needed when using the Dockerfile in db/
      - /nfs/qumulo-a/grafana01/postgres/schema:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-perocube}" ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - network

  # Flyway service for database migrations
  flyway:
    image: flyway/flyway:11-alpine
    container_name: flyway
    command: -url=jdbc:postgresql://timescaledb:5432/${DB_NAME:-perocube} -user=${DB_USER:-postgres} -password=${DB_PASSWORD} -connectRetries=60 migrate
    volumes:
      - /nfs/qumulo-a/grafana01/flyway/migrations:/flyway/sql
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - network

  # JupyterHub service
  jupyterhub:
    # image: jupyter/datascience-notebook:latest
    #build: ./jupyter
    image: ghcr.io/paolog8/perocube-jupyter:latest
    container_name: jupyter
    user: root
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-jupytertoken} # Set this in .env file
      - POSTGRES_HOST=timescaledb
      - POSTGRES_DB=${DB_NAME:-perocube}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_PORT=${DB_PORT:-5432}
    ports:
      - "8888:8888" # Jupyter port
      - "8866:8866" # Voilà port
    volumes:
      - /nfs/qumulo-a/grafana01/jupyter/work:/home/jovyan/work
      - /nfs/qumulo-a/grafana01/jupyter/notebooks:/home/jovyan/notebooks
      - /nfs/qumulo-a/grafana01/jupyter/sample_data:/home/jovyan/sample_data
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/hub/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command:
      - start-notebook.sh
      - --NotebookApp.token=${JUPYTER_TOKEN:-jupytertoken}
      - --NotebookApp.base_url=/hub
      #>
      #bash -c "pip install voila ipywidgets &&
    networks:
      - network
  # Voilà dashboards will run through the Jupyter service
  # You can access any notebook as a dashboard via:
  # http://localhost:8888/voila/render/notebooks/YourNotebook.ipynb

  # Grafana service for dashboards
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      # Pass DB credentials for provisioning interpolation
      DB_NAME: ${DB_NAME:-perocube}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /nfs/qumulo-a/grafana01/grafana/data:/var/lib/grafana
      - /nfs/qumulo-a/grafana01/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - network

  # Streamlit App for Metadata Ingestion
  streamlit:
    build: .
    container_name: streamlit
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=timescaledb
      - DB_NAME=${DB_NAME:-perocube}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/service_admin/perocube-data-monitoring-system/config/certs/:/etc/nginx/ssl/
    depends_on:
      grafana:
        condition: service_healthy
      jupyterhub:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network

networks:
  network:
    driver: bridge
