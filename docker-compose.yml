services:
  # TimescaleDB (PostgreSQL) service
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    #build: ./db
    container_name: postgres
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-perocube}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - /nfs/qumulo-a/grafana01/postgres/data:/var/lib/postgresql/data
      - /nfs/qumulo-a/grafana01/postgres/scripts:/scripts
      - /nfs/qumulo-a/grafana01/postgres/sql:/sql
      # following line not needed when using the Dockerfile in db/
      - /nfs/qumulo-a/grafana01/postgres/schema:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-perocube}",
        ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - network

  # Flyway service for database migrations
  flyway:
    image: flyway/flyway:11-alpine
    container_name: flyway
    command: -url=jdbc:postgresql://timescaledb:5432/${DB_NAME:-perocube} -user=${DB_USER:-postgres} -password=${DB_PASSWORD} -connectRetries=60 migrate
    volumes:
      - /nfs/qumulo-a/grafana01/flyway/migrations:/flyway/sql
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - network

  # JupyterHub service
  jupyterhub:
    # image: jupyter/datascience-notebook:latest
    #build: ./jupyter
    image: ghcr.io/paolog8/perocube-jupyter:latest
    container_name: jupyter
    user: root
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-jupytertoken} # Set this in .env file
      - POSTGRES_HOST=timescaledb
      - POSTGRES_DB=${DB_NAME:-perocube}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_PORT=${DB_PORT:-5432}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "8888:8888" # Jupyter port
      - "8866:8866" # Voilà port
    volumes:
      - /nfs/qumulo-a/grafana01/jupyter/work:/home/jovyan/work
      - /nfs/qumulo-a/grafana01/jupyter/notebooks:/home/jovyan/notebooks
      - /nfs/qumulo-a/grafana01/jupyter/sample_data:/home/jovyan/sample_data
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/hub/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command:
      - start-notebook.sh
      - --NotebookApp.token=${JUPYTER_TOKEN:-jupytertoken}
      - --NotebookApp.base_url=/hub
      #>
      #bash -c "pip install voila ipywidgets &&
    networks:
      - network
  # Voilà dashboards will run through the Jupyter service
  # You can access any notebook as a dashboard via:
  # http://localhost:8888/voila/render/notebooks/YourNotebook.ipynb

  # Grafana service for dashboards
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      # Pass DB credentials for provisioning interpolation
      DB_NAME: ${DB_NAME:-perocube}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - /nfs/qumulo-a/grafana01/grafana/data:/var/lib/grafana
      - /nfs/qumulo-a/grafana01/grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/repo-dashboards:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - network

  # Streamlit App for Metadata Ingestion
  streamlit:
    build: .
    container_name: streamlit
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=timescaledb
      - DB_NAME=${DB_NAME:-perocube}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - network

  # Creates the outdoor_monitoring database if it does not already exist.
  # Runs before flyway-outdoor so Flyway always has a database to connect to.
  create-outdoor-db:
    image: timescale/timescaledb:latest-pg15
    entrypoint:
      - sh
      - -c
      - |
        psql -h timescaledb -U ${DB_USER:-postgres} -c \
          "CREATE DATABASE outdoor_monitoring;" 2>&1 \
          | grep -v "already exists"; exit 0
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER:-postgres}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - network

  # Flyway — apply outdoor_monitoring schema (V1-V22) to the new database
  flyway-outdoor:
    image: flyway/flyway:11-alpine
    container_name: flyway-outdoor
    command: >
      -url=jdbc:postgresql://timescaledb:5432/outdoor_monitoring
      -user=${DB_USER:-postgres}
      -password=${DB_PASSWORD}
      -connectRetries=60
      migrate
    environment:
      - FLYWAY_PLACEHOLDERS_SYM_PASSWORD=${SYM_PASSWORD}
    volumes:
      - ./db/outdoor_migrations:/flyway/sql
    depends_on:
      create-outdoor-db:
        condition: service_completed_successfully
    networks:
      - network

  # Flyway — install SymmetricDS topology config into outdoor_monitoring
  flyway-sym-config:
    image: flyway/flyway:11-alpine
    container_name: flyway-sym-config
    command: migrate
    env_file:
      - .env
      - flyway-sym-config.env
    environment:
      FLYWAY_URL: jdbc:postgresql://timescaledb:5432/outdoor_monitoring
      FLYWAY_USER: ${DB_USER:-postgres}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./symmetricds/sql:/flyway/sym_sql
    depends_on:
      flyway-outdoor:
        condition: service_completed_successfully
    networks:
      - network

  # SymmetricDS hub — receives one-way sync from outdoor measuring PC
  # Served via nginx at /sync/ (no external port needed)
  symmetricds-hub:
    image: jumpmind/symmetricds:3.17.0
    container_name: symmetricds-hub
    ports:
      - "31415:31415"
      - "31417:31417"
    environment:
      - SYM_PASSWORD=${SYM_PASSWORD}
      - SYM_SERVER_ADDRESS=${SYM_SERVER_ADDRESS}
      - SYM_SERVER_PORT=31415
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./symmetricds/engines/outdoor-hub.properties:/opt/symmetric-ds/engines/outdoor-hub.properties
      - /nfs/qumulo-a/grafana01/symmetricds/tmp:/opt/symmetric-ds/tmp
      - /nfs/qumulo-a/grafana01/symmetricds/logs:/opt/symmetric-ds/logs
    depends_on:
      flyway-sym-config:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      - no_proxy=symmetricds-hub,grafana,jupyterhub,localhost,127.0.0.1,172.17.0.0/16
      - NO_PROXY=symmetricds-hub,grafana,jupyterhub,localhost,127.0.0.1,172.17.0.0/16
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/service_admin/perocube-data-monitoring-system/config/certs/:/etc/nginx/ssl/
    depends_on:
      grafana:
        condition: service_healthy
      jupyterhub:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network

networks:
  network:
    driver: bridge
