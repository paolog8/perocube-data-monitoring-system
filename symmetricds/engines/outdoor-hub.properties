# SymmetricDS hub engine — receives one-way sync from the outdoor measuring PC.
# Manages the outdoor_monitoring database on the remote server.
#
# Placeholder: replace <SERVER_HOSTNAME> with the actual public hostname
# before deploying (e.g. grafana01.bessy.de).

engine.name=outdoor-hub

# Database connection (outdoor_monitoring database in the existing postgres container)
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://timescaledb:5432/outdoor_monitoring
db.user=sym_user
db.password=$(SYM_PASSWORD)

# Node identity
group.id=hub
external.id=000

# Public sync URL — served via nginx at /sync/
sync.url=https://solar-energy-data.helmholtz-berlin.de/sync/outdoor-hub

# Accept edge node registrations automatically
auto.registration=true

# This hub only receives pushes from the edge — disable pull job
# (the hub's pull job tries to reach the edge's internal Docker hostname,
# which is unresolvable from the hub server and causes repeated errors)
job.pull.auto.start=false
